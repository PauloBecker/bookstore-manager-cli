version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bookstore_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data